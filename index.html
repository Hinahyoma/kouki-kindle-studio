<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洸樹 Kindle Studio — 試作版</title><style>:root{font-family:system-ui,'Yu Gothic',sans-serif;color:#263146;background:#f5f6fa}*{box-sizing:border-box}body{margin:0}header{background:#202c49;color:white;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}header h1{margin:0;font-size:22px}header small{color:#cbd5e1}.wrap{max-width:1240px;margin:auto;padding:22px}nav{display:flex;gap:8px;overflow:auto;margin-bottom:18px}button,.btn{border:1px solid #d7dce6;background:white;border-radius:9px;padding:10px 14px;cursor:pointer;color:#263146;font:inherit}button.active,button.primary{background:#384c80;color:white;border-color:#384c80}button:hover{filter:brightness(.96)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card,.panel{background:white;border:1px solid #e2e5ec;border-radius:14px;padding:18px;margin-bottom:14px}.card strong{display:block;font-size:27px;margin-top:8px}.muted{color:#6c778b;font-size:13px}h2{font-size:20px;margin:0 0 14px}h3{margin:0 0 10px;font-size:16px}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}input,textarea,select{width:100%;border:1px solid #cbd2df;border-radius:8px;padding:10px;font:inherit;background:white;color:#263146}textarea{min-height:95px;resize:vertical}.editor{min-height:330px;line-height:1.9;font-size:16px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.pill{font-size:12px;background:#edf1fa;border-radius:20px;padding:4px 9px;display:inline-block}.progress{background:#e5eaf2;border-radius:20px;height:9px;overflow:hidden}.progress>div{background:#6176b1;height:100%}.item{padding:12px;border-bottom:1px solid #e8ebf1;cursor:pointer}.item:hover{background:#f5f7fb}.notice{background:#fff9e9;border:1px solid #f0dfac;border-radius:10px;padding:12px;font-size:13px;margin-bottom:16px}footer{padding:18px;color:#69778b;font-size:12px;text-align:center}@media(max-width:650px){.cols{grid-template-columns:1fr}.wrap{padding:12px}header{padding:16px}button{padding:9px}}</style><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script></head><body><header><div><h1>洸樹 Kindle Studio <small>クラウド対応準備版 v0.2</small></h1><small>企画から執筆・表紙・出版まで</small></div><div><button onclick="exportData()">データをバックアップ</button><button onclick="document.getElementById('restore').click()">復元</button><input id="restore" type="file" accept="application/json" hidden onchange="restoreData(event)"></div></header><main class="wrap"><div class="notice">クラウド同期はSupabaseの設定・メールログイン後に有効になります。未接続中は端末内に保存されます。重要な原稿はJSONバックアップも取ってください。</div>
<div class="panel" id="cloudPanel"><h3>クラウド同期設定</h3>
<p class="muted">SupabaseのProject URLと公開用 anon/publishable key を入力してください。service_roleキーは絶対に入力しないでください。</p>
<div class="cols"><div><label>Project URL</label><input id="sbUrl" placeholder="https://xxxx.supabase.co"></div><div><label>Publishable / anon key</label><input id="sbKey" type="password" placeholder="sb_publishable_... または eyJ..."></div></div>
<div class="cols"><div><label>メールアドレス</label><input id="sbEmail" type="email" autocomplete="email"></div><div><label>パスワード</label><input id="sbPassword" type="password" autocomplete="current-password"></div></div>
<div class="actions"><button onclick="cloudLogin(false)">ログインして同期</button><button onclick="cloudLogin(true)">新規登録</button><button onclick="cloudLogout()">ログアウト</button><button onclick="cloudPushFirst()">この端末のデータを初回アップロード</button><button onclick="cloudPull()">クラウドから再読み込み</button></div>
<p id="cloudStatus" class="muted" role="status">未接続</p></div><nav id="nav"></nav><section id="app"></section></main><footer>個人用プロトタイプ / Kindle出版・販売実績は手動管理 / Amazon KDPとは未接続</footer><script>
const seed=[{id:'w1',title:'無能と呼ばれた私が退職したら、会社の売上が消えました',genre:'現代職場ざまぁ',target:40000,price:499},{id:'w2',title:'婚約破棄されたので、王国への融資をすべて引き揚げます',genre:'婚約破棄・悪役令嬢',target:50000,price:699},{id:'w3',title:'追放された下級女官、実は皇帝の密命を受けていました',genre:'中華宮廷・知略ざまぁ',target:50000,price:699}].map(x=>({...x,status:'企画中',summary:'',audience:'',differentiation:'',deadline:'',chapters:[{id:'c'+x.id,title:'第1章',body:''}],prompts:[],tasks:[],coverNote:'',coverImages:[],kdp:{description:'',keywords:'',category:'',asin:'',url:'',aiDisclosure:'未確認'},sales:[]}));let state;try{state=JSON.parse(localStorage.getItem('kouki-studio-v01'))}catch{}if(!state||!Array.isArray(state.works))state={works:seed,selected:'w1'};let page='home',chapterId=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('kouki-studio-v01',JSON.stringify(state)); scheduleCloudSave()}function work(){return state.works.find(x=>x.id===state.selected)||state.works[0]}function chars(s){return [...(s||'')].filter(c=>!/[\s\r\n]/.test(c)).length}function count(w){return w.chapters.reduce((a,c)=>a+chars(c.body),0)}function nav(){let pages=[['home','ホーム'],['works','作品・企画'],['editor','原稿エディタ'],['ai','AIプロンプト'],['cover','表紙'],['publish','出版準備'],['sales','販売記録']];$('nav').innerHTML=pages.map(([k,n])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${n}</button>`).join('')}function go(p){page=p;render()}function sel(){return `<label>対象作品</label><select onchange="state.selected=this.value;chapterId=null;save();render()">${state.works.map(w=>`<option value="${w.id}" ${w.id===work().id?'selected':''}>${esc(w.title)}</option>`).join('')}</select>`}function render(){nav();let w=work();if(page==='home')home();if(page==='works')works();if(page==='editor')editor();if(page==='ai')ai();if(page==='cover')cover();if(page==='publish')publish();if(page==='sales')sales()}function home(){let total=state.works.reduce((a,w)=>a+count(w),0),done=state.works.filter(w=>w.status==='出版済').length;$('app').innerHTML=`<div class="grid"><div class="card">登録作品<strong>${state.works.length}</strong></div><div class="card">累計執筆文字数<strong>${total.toLocaleString()}</strong></div><div class="card">出版済み<strong>${done}</strong></div></div><div class="panel"><h2>作品別進捗</h2>${state.works.map(w=>{let n=count(w),pct=Math.min(100,Math.round(n/(w.target||1)*100));return `<div class="item" onclick="state.selected='${w.id}';go('editor')"><b>${esc(w.title)}</b><p class="muted">${esc(w.genre)} ・ ${esc(w.status)} ・ ${n.toLocaleString()} / ${(w.target||0).toLocaleString()}字（${pct}%）</p><div class="progress"><div style="width:${pct}%"></div></div></div>`}).join('')}</div><div class="panel"><h2>次の作業</h2>${state.works.flatMap(w=>(w.tasks||[]).filter(t=>!t.done).map(t=>`<p>${esc(w.title)}：${esc(t.text)}</p>`)).join('')||'<p class="muted">未完了タスクはありません。作品・企画画面から登録できます。</p>'}</div>`}function field(label,key,type='text'){let w=work(),v=w[key]??'';return `<label>${label}</label>${type==='textarea'?`<textarea oninput="update('${key}',this.value)">${esc(v)}</textarea>`:`<input type="${type}" value="${esc(v)}" oninput="update('${key}',this.value)">`}`}function update(k,v){work()[k]=['target','price'].includes(k)?Number(v):v;save()}function works(){$('app').innerHTML=`<div class="panel"><h2>作品企画</h2>${sel()}${field('タイトル','title')}${field('ジャンル','genre')}<div class="cols"><div>${field('目標文字数','target','number')}</div><div>${field('予定販売価格（円）','price','number')}</div></div><label>制作状況</label><select onchange="update('status',this.value)">${['企画中','構成中','執筆中','校正中','出版準備','出版済','保留'].map(s=>`<option ${work().status===s?'selected':''}>${s}</option>`).join('')}</select>${field('出版目標日','deadline','date')}${field('あらすじ・企画意図','summary','textarea')}${field('想定読者','audience','textarea')}${field('差別化ポイント','differentiation','textarea')}<div class="actions"><button class="primary" onclick="save();render();alert('保存しました')">保存</button><button onclick="addWork()">新規作品を追加</button><button onclick="removeWork()">選択作品を削除</button></div></div><div class="panel"><h2>制作タスク</h2><div id="tasks">${(work().tasks||[]).map((t,i)=>`<div class="item"><label><input style="width:auto" type="checkbox" ${t.done?'checked':''} onchange="work().tasks[${i}].done=this.checked;save();render()"> ${esc(t.text)}</label></div>`).join('')}</div><div class="actions"><input id="newtask" placeholder="次にやること" style="flex:1"><button onclick="let v=$('newtask').value.trim();if(v){work().tasks.push({text:v,done:false});save();render()}">追加</button></div></div>`}function addWork(){let title=prompt('新しい作品のタイトル');if(!title?.trim())return;let id='w'+Date.now();state.works.push({id,title,genre:'',target:40000,price:499,status:'企画中',summary:'',audience:'',differentiation:'',deadline:'',chapters:[{id:'c'+id,title:'第1章',body:''}],prompts:[],tasks:[],coverNote:'',coverImages:[],kdp:{description:'',keywords:'',category:'',asin:'',url:'',aiDisclosure:'未確認'},sales:[]});state.selected=id;save();render()}function removeWork(){if(state.works.length<2)return alert('最低1作品は残してください');if(!confirm('この作品と原稿を削除しますか？バックアップを推奨します。'))return;state.works=state.works.filter(w=>w.id!==state.selected);state.selected=state.works[0].id;save();render()}function editor(){let w=work();if(!w.chapters.length)w.chapters.push({id:'c'+Date.now(),title:'第1章',body:''});let c=w.chapters.find(c=>c.id===chapterId)||w.chapters[0];chapterId=c.id;$('app').innerHTML=`<div class="panel"><h2>原稿エディタ</h2>${sel()}<div class="cols"><div><label>章を選択</label><select onchange="chapterId=this.value;render()">${w.chapters.map(c=>`<option value="${c.id}" ${c.id===chapterId?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div><div><label>章タイトル</label><input value="${esc(c.title)}" oninput="chapter().title=this.value;save()"></div></div><div class="actions"><button onclick="addChapter()">章を追加</button><button onclick="deleteChapter()">章を削除</button><button onclick="downloadText()">全文をTXT出力</button></div><label>本文（自動保存）</label><textarea id="body" class="editor" oninput="chapter().body=this.value;save();stats()">${esc(c.body)}</textarea><p class="muted" id="stats"></p></div><div class="panel"><h3>作品設定・あらすじ</h3><p style="white-space:pre-wrap">${esc(w.summary)||'作品・企画画面で登録してください。'}</p></div>`;stats()}function chapter(){return work().chapters.find(c=>c.id===chapterId)}function stats(){let el=$('stats');if(el)el.textContent=`この章 ${chars(chapter().body).toLocaleString()}字 / 作品全体 ${count(work()).toLocaleString()}字 / 目標 ${(work().target||0).toLocaleString()}字（空白・改行を除く）`}function addChapter(){let name=prompt('章タイトル','第'+(work().chapters.length+1)+'章');if(!name)return;let c={id:'c'+Date.now(),title:name,body:''};work().chapters.push(c);chapterId=c.id;save();render()}function deleteChapter(){if(work().chapters.length===1)return alert('最後の章は削除できません');if(!confirm('この章の本文を削除しますか？'))return;work().chapters=work().chapters.filter(c=>c.id!==chapterId);chapterId=null;save();render()}function ai(){let w=work();$('app').innerHTML=`<div class="panel"><h2>AI執筆プロンプト</h2>${sel()}<label>今回の執筆指示</label><textarea id="instruction" placeholder="例：第1章の冒頭を主人公視点で3000字程度執筆。"></textarea><div class="actions"><button class="primary" onclick="makePrompt()">作品情報からプロンプト生成</button><button onclick="copyPrompt()">プロンプトをコピー</button><button onclick="savePrompt()">履歴に保存</button></div><label>生成プロンプト（編集可能）</label><textarea id="promptout" style="min-height:280px"></textarea></div><div class="panel"><h3>保存したプロンプト</h3>${(w.prompts||[]).slice().reverse().map((p,i)=>`<div class="item"><b>${esc(p.date)}</b><p class="muted" style="white-space:pre-wrap;max-height:90px;overflow:hidden">${esc(p.text)}</p><button onclick="$('promptout').value=work().prompts[${w.prompts.length-1-i}].text">読み込む</button></div>`).join('')||'<p class="muted">履歴はまだありません。</p>'}</div>`}function makePrompt(){let w=work();$('promptout').value=`あなたは日本語の商業小説の執筆補助者です。以下の作品設定を尊重し、独自の文章で提案してください。\n作品名：${w.title}\nジャンル：${w.genre}\nあらすじ：${w.summary||'未設定'}\n想定読者：${w.audience||'未設定'}\n差別化：${w.differentiation||'未設定'}\n今回の依頼：${$('instruction').value||'章の構成案を提案してください'}\n既存設定と矛盾する箇所は明示してください。`};function copyPrompt(){let v=$('promptout').value;if(!v)return;let t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('コピーしました')}function savePrompt(){let v=$('promptout').value.trim();if(!v)return;work().prompts.push({date:new Date().toLocaleString('ja-JP'),text:v});save();render()}function cover(){$('app').innerHTML=`<div class="panel"><h2>表紙制作</h2>${sel()}<label>表紙コンセプト・画像生成指示</label><textarea oninput="work().coverNote=this.value;save()">${esc(work().coverNote)}</textarea><label>表紙画像（この試作版では画像はブラウザ保存容量を圧迫するためファイル名のみ記録）</label><input type="file" accept="image/*" onchange="if(this.files[0]){work().coverImages.push(this.files[0].name);save();render()}"><p class="muted">画像本体のクラウド保存とプレビューは正式版で実装します。</p>${work().coverImages.map(x=>`<p class="pill">${esc(x)}</p>`).join('')}</div>`}function publish(){let w=work(),k=w.kdp;$('app').innerHTML=`<div class="panel"><h2>Kindle出版準備</h2>${sel()}${['description|書籍紹介文','keywords|検索キーワード','category|カテゴリー','asin|ASIN','url|Amazon商品ページURL'].map(x=>{let [key,label]=x.split('|');return `<label>${label}</label><textarea oninput="work().kdp['${key}']=this.value;save()">${esc(k[key])}</textarea>`}).join('')}<label>AI生成コンテンツの申告確認</label><select onchange="work().kdp.aiDisclosure=this.value;save()">${['未確認','確認中','申告内容確定'].map(s=>`<option ${k.aiDisclosure===s?'selected':''}>${s}</option>`).join('')}</select><div class="notice" style="margin-top:14px">KDPへの自動投稿は行いません。原稿の書き出し・KDP画面への入力は手動です。最新の公式要件を確認してください。</div></div>`}function sales(){let w=work();let sum=(w.sales||[]).reduce((a,x)=>a+Number(x.royalty||0),0);$('app').innerHTML=`<div class="panel"><h2>販売実績（手動入力）</h2>${sel()}<p>累計入力ロイヤリティ：<b>${sum.toLocaleString()} 円</b></p><div class="cols"><div><label>対象月</label><input type="month" id="month"></div><div><label>ロイヤリティ（円）</label><input type="number" id="royalty" min="0"></div></div><div class="actions"><button class="primary" onclick="addSale()">実績を追加</button></div>${(w.sales||[]).map(s=>`<div class="item">${esc(s.month)}：${Number(s.royalty).toLocaleString()}円</div>`).join('')}</div>`}function addSale(){let m=$('month').value,r=$('royalty').value;if(!m||r==='')return alert('月と金額を入力してください');work().sales.push({month:m,royalty:Number(r)});save();render()}function download(name,data,type){let blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function downloadText(){let w=work();download(w.title.replace(/[\\/:*?"<>|]/g,'_')+'.txt',w.chapters.map(c=>c.title+'\n\n'+c.body).join('\n\n'),'text/plain;charset=utf-8')}function exportData(){download('kouki_studio_backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,2),'application/json')}function restoreData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.works)||!d.works.length)throw Error();if(!confirm('現在のデータをバックアップファイルの内容で置き換えますか？'))return;state=d;save();render()}catch{alert('復元できない形式です')}};r.readAsText(f)}
let sbClient=null, cloudReady=false, cloudTimer=null, cloudBusy=false, cloudVersion=null, cloudDirty=false;
const cloudStatus=(msg)=>{const e=document.getElementById('cloudStatus');if(e)e.textContent=msg};
function initCloudFields(){
  document.getElementById('sbUrl').value=localStorage.getItem('kouki-sb-url')||'';
  document.getElementById('sbKey').value=localStorage.getItem('kouki-sb-key')||'';
}
function cloudClient(){
  if(!window.supabase){cloudStatus('同期ライブラリを読み込めません。インターネット接続を確認してください。');return null}
  const url=document.getElementById('sbUrl').value.trim();
  const key=document.getElementById('sbKey').value.trim();
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(url)||!key){cloudStatus('正しいProject URLと公開用キーを入力してください。');return null}
  localStorage.setItem('kouki-sb-url',url);localStorage.setItem('kouki-sb-key',key);
  if(!sbClient||sbClient.supabaseUrl!==url)sbClient=window.supabase.createClient(url,key);
  return sbClient;
}
async function cloudLogin(signup){
  const client=cloudClient();if(!client)return;
  const email=document.getElementById('sbEmail').value.trim();
  const password=document.getElementById('sbPassword').value;
  if(!email||!password){cloudStatus('メールアドレスとパスワードを入力してください。');return}
  cloudStatus('認証中…');
  const result=signup?await client.auth.signUp({email,password}):await client.auth.signInWithPassword({email,password});
  if(result.error){cloudStatus('認証エラー: '+result.error.message);return}
  if(signup&&!result.data.session){cloudStatus('確認メールを開いて認証後、ログインしてください。');return}
  cloudReady=true;
  await cloudPull();
}
async function cloudLogout(){
  if(sbClient)await sbClient.auth.signOut();
  cloudReady=false;cloudVersion=null;cloudStatus('ログアウトしました。端末内保存のみ有効です。');
}
async function cloudPull(){
  const client=cloudClient();if(!client)return;
  const {data:auth}=await client.auth.getUser();
  if(!auth.user){cloudStatus('ログインしてください。');return}
  const {data,error}=await client.from('studio_documents').select('payload,revision').eq('user_id',auth.user.id).maybeSingle();
  if(error){cloudStatus('読込エラー: '+error.message+'（SQL設定を確認）');return}
  cloudReady=true;
  if(!data){cloudVersion=null;cloudStatus('クラウドは空です。既存の原稿を送る場合は「初回アップロード」を押してください。');return}
  if(cloudDirty&&!confirm('この端末に未同期の変更があります。クラウドの内容で置き換えますか？'))return;
  if(!data.payload||!Array.isArray(data.payload.works)){cloudStatus('クラウドデータ形式が不正です。');return}
  state=data.payload;cloudVersion=data.revision;cloudDirty=false;
  localStorage.setItem('kouki-studio-v01',JSON.stringify(state));
  render();cloudStatus('同期済み（クラウド版 '+cloudVersion+'）');
}
async function cloudPushFirst(){
  const client=cloudClient();if(!client)return;
  const {data:auth}=await client.auth.getUser();
  if(!auth.user){cloudStatus('先にログインしてください。');return}
  if(!confirm('この端末の現在の作品と原稿をクラウドへ登録します。クラウドに既存データがある場合は上書きしません。続けますか？'))return;
  const {data,error}=await client.from('studio_documents').insert({user_id:auth.user.id,payload:state,revision:1}).select('revision').single();
  if(error){cloudStatus('アップロードできません: '+error.message+'。既存データがある場合はクラウドから再読み込みしてください。');return}
  cloudReady=true;cloudVersion=data.revision;cloudDirty=false;cloudStatus('初回アップロード完了。以後は自動同期します。');
}
function scheduleCloudSave(){
  cloudDirty=true;
  if(!cloudReady||cloudVersion===null)return;
  clearTimeout(cloudTimer);cloudStatus('編集中・同期待ち…');
  cloudTimer=setTimeout(cloudSave,1100);
}
async function cloudSave(){
  if(!cloudReady||cloudVersion===null||cloudBusy)return;
  const client=cloudClient();if(!client)return;
  cloudBusy=true;const current=JSON.stringify(state),expected=cloudVersion;
  const {data:auth}=await client.auth.getUser();
  if(!auth.user){cloudReady=false;cloudBusy=false;cloudStatus('ログインが切れました。');return}
  const {data,error}=await client.from('studio_documents').update({payload:JSON.parse(current),revision:expected+1,updated_at:new Date().toISOString()}).eq('user_id',auth.user.id).eq('revision',expected).select('revision').maybeSingle();
  cloudBusy=false;
  if(error){cloudStatus('同期エラー: '+error.message+'。JSONバックアップを取ってください。');return}
  if(!data){cloudReady=false;cloudStatus('他の端末で更新されています。JSONバックアップ後、クラウドから再読み込みしてください。自動上書きを停止しました。');return}
  cloudVersion=data.revision;cloudDirty=JSON.stringify(state)!==current;
  cloudStatus('同期済み（クラウド版 '+cloudVersion+'）');
  if(cloudDirty)scheduleCloudSave();
}

initCloudFields();render();</script></body></html>
